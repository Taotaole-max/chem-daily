  - {name: ScienceDaily 化学, kind: news, tier: 6, group: 新闻, rss: "https://www.sciencedaily.com/rss/matter_energy/chemistry.xml"}
  - {name: Science News, kind: news, tier: 7, group: 新闻, rss: "https://www.sciencenews.org/topic/chemistry/feed"}
