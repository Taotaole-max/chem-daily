# 信息源清单
# 每个源：
#   name   显示在卡片上的来源标签
#   kind   paper（论文）/ preprint（预印本）/ news（新闻）
#   tier   影响力档次 1–10，用于初筛排序（不是绝对标准，AI 选稿时还会再判断）
#   rss    RSS 地址；抓不到时用 issn 走 Crossref 兜底
#   crossref_prefix  没有 RSS、直接按 DOI 前缀从 Crossref 取（ChemRxiv 官方接口拦机器访问）
#   issn   电子版 ISSN（Crossref 兜底用）
#   broad  true 表示综合期刊，要先用关键词过滤出化学相关的
#   group  关于页里的分组

sources:
  # ---------- 综合顶刊 ----------
  - {name: Nature, kind: paper, tier: 10, group: 综合顶刊, broad: true, rss: "https://www.nature.com/nature.rss", issn: "1476-4687"}
  - {name: Science, kind: paper, tier: 10, group: 综合顶刊, broad: true, rss: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science", issn: "1095-9203"}
  - {name: Nature Communications, kind: paper, tier: 7, group: 综合顶刊, broad: true, rss: "https://www.nature.com/subjects/chemistry/ncomms.rss", issn: "2041-1723"}
  - {name: Science Advances, kind: paper, tier: 7, group: 综合顶刊, broad: true, rss: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=sciadv", issn: "2375-2548"}
  - {name: PNAS, kind: paper, tier: 7, group: 综合顶刊, broad: true, rss: "https://www.pnas.org/action/showFeed?type=etoc&feed=rss&jc=pnas", issn: "1091-6490"}

