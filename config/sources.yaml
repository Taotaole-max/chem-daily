  - {name: Nature Materials, kind: paper, tier: 9, group: Nature 子刊, rss: "https://www.nature.com/nmat.rss", issn: "1476-4660"}
  - {name: Nature Energy, kind: paper, tier: 9, group: Nature 子刊, rss: "https://www.nature.com/nenergy.rss", issn: "2058-7546"}
  - {name: Nature Synthesis, kind: paper, tier: 8, group: Nature 子刊, rss: "https://www.nature.com/natsynth.rss", issn: "2731-0582"}
  - {name: Nature Reviews Chemistry, kind: paper, tier: 8, group: Nature 子刊, rss: "https://www.nature.com/natrevchem.rss", issn: "2397-3358"}
  - {name: Nature Chemical Engineering, kind: paper, tier: 8, group: Nature 子刊, rss: "https://www.nature.com/natchemeng.rss", issn: "2948-1198"}
  - {name: Nature Computational Science, kind: paper, tier: 8, group: Nature 子刊, rss: "https://www.nature.com/natcomputsci.rss", issn: "2662-8457"}
  - {name: Nature Machine Intelligence, kind: paper, tier: 7, group: Nature 子刊, broad: true, rss: "https://www.nature.com/natmachintell.rss", issn: "2522-5839"}

