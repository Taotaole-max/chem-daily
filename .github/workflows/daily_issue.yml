# 每天北京时间 8 点（UTC 0 点）自动出一期日报并发布到 GitHub Pages
name: 每日出刊

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "重新生成今天这期（覆盖）"
        type: boolean
        default: false
      hot:
        description: "强制刷新热榜"
        type: boolean
        default: false
      trends:
        description: "强制重新生成本月趋势"
        type: boolean
        default: false
      xhs:
        description: "重新生成今天的小红书草稿"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["templates/**", "static/**", "config/site.yaml", "chemdaily/build_site.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 小红书配图用 Chrome 截图，需要中文字体
      - run: sudo apt-get install -y -q fonts-noto-cjk > /dev/null

      - name: 抓取、选稿、写稿、生成网页
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python run_daily.py --build-only
            exit 0
          fi
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.hot }}" = "true" ] && ARGS="$ARGS --hot"
          [ "${{ inputs.trends }}" = "true" ] && ARGS="$ARGS --trends"
          [ "${{ inputs.xhs }}" = "true" ] && ARGS="$ARGS --xhs"
          python run_daily.py $ARGS

      - name: 把今天的数据提交回仓库
        if: github.event_name != 'push'
        run: |
          git config user.name "chem-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "出刊 $(TZ=Asia/Shanghai date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: issue
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
